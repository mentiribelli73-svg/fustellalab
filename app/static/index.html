<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>FustellaLab · Progetti</title><style>body{margin:0;background:#101722;color:#edf2f9;font:16px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:22px 5%;border-bottom:1px solid #364357}main{max-width:1000px;margin:35px auto;padding:0 20px}button,a.btn{display:inline-block;background:#dca966;color:#101722;padding:11px 16px;border:0;border-radius:9px;font-weight:700;text-decoration:none;cursor:pointer}input,textarea{background:#1d2938;color:white;border:1px solid #566274;border-radius:7px;padding:12px;width:100%;box-sizing:border-box;margin:6px 0 14px}article{background:#1c2938;border:1px solid #37475a;border-radius:12px;padding:18px;margin:12px 0}a{color:#edbe7d}small{color:#b2c0d2}nav{display:flex;gap:12px;flex-wrap:wrap}h1{margin:0}#msg{min-height:25px;color:#f1c889}details{background:#1c2938;padding:18px;border-radius:12px;margin-bottom:24px}label{display:block}</style></head><body><header><h1>◈ FustellaLab</h1><nav><a class="btn" href="/editor.html">Studio 2D</a><a class="btn" href="/importa.html">Importa fustella</a></nav></header><main><h2>Archivio progetti</h2><p>Progetti persistenti con versioni salvate nel database locale. L'editor geometrico esistente è ancora separato: puoi importare ed esportare i suoi file, ma non è ancora sincronizzato automaticamente.</p><details><summary><strong>+ Nuovo progetto</strong></summary><form id="form"><label>Nome<input id="name" required maxlength="160" placeholder="Es. Astuccio profumo 50 ml"></label><label>Descrizione<textarea id="description" placeholder="Materiale, chiusura, cliente..."></textarea></label><button>Crea progetto</button></form></details><p id="msg"></p><section id="projects">Caricamento...</section></main><script>
const $=id=>document.getElementById(id);let current=null;
async function api(path,opts){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw Error((await r.json()).detail||'Errore '+r.status);return r.status===204?null:r.json()}
function el(tag,text){const x=document.createElement(tag);x.textContent=text;return x}
async function load(){try{let list=await api('/projects');$('projects').replaceChildren();if(!list.length)$('projects').append(el('p','Nessun progetto salvato. Creane uno.'));for(const p of list){let a=el('article','');let h=el('h3',p.name);let meta=el('small','Revisione '+p.revision+' · '+new Date(p.updated_at).toLocaleString('it-IT'));let desc=el('p',p.description||'Nessuna descrizione');let open=el('button','Apri dati');open.onclick=()=>show(p.id);a.append(h,meta,desc,open);$('projects').append(a)}}catch(e){$('msg').textContent=e.message}}
async function show(id){try{let p=await api('/projects/'+id);current=p;const box=el('article','');box.append(el('h3','Modifica: '+p.name));const n=el('input','');n.value=p.name;const d=el('textarea','');d.value=p.description;const json=el('textarea','');json.rows=12;json.value=JSON.stringify(p.document,null,2);box.append(el('p','Nome'),n,el('p','Descrizione'),d,el('p','Documento JSON (struttura modificabile)'),json);const save=el('button','Salva nuova revisione');save.onclick=async()=>{try{let document=JSON.parse(json.value);let r=await api('/projects/'+id,{method:'PUT',body:JSON.stringify({name:n.value,description:d.value,document,expected_revision:current.revision})});$('msg').textContent='Salvata revisione '+r.revision;await load();await show(id)}catch(e){$('msg').textContent=e.message}};const history=el('button','Cronologia');history.style.marginLeft='10px';history.onclick=async()=>{let revisions=await api('/projects/'+id+'/revisions');alert(revisions.map(x=>'Rev '+x.revision+' · '+x.saved_at).join('\n'))};const exportBtn=el('button','Esporta JSON');exportBtn.style.marginLeft='10px';exportBtn.onclick=()=>{let blob=new Blob([JSON.stringify({...current,document:JSON.parse(json.value)},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fustellalab-'+id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};box.append(save,history,exportBtn);$('projects').prepend(box)}catch(e){$('msg').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();try{await api('/projects',{method:'POST',body:JSON.stringify({name:$('name').value,description:$('description').value,document:{format:'fustellalab-project',version:1,objects:[],parameters:{}}})});$('form').reset();$('msg').textContent='Progetto creato';load()}catch(e){$('msg').textContent=e.message}};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
