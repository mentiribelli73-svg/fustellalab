<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FustellaLab · Il mio progetto</title><style>body{margin:0;min-height:100vh;background:#1d211f;color:#f6f0e7;font:16px system-ui}main{max-width:750px;margin:8vh auto;padding:25px}a{color:#e8b773}article{background:#f7efe4;color:#28221d;border-radius:22px;padding:27px}h1{font-size:36px}p{line-height:1.6}button,.btn{display:inline-block;border:0;border-radius:12px;background:#e6b46a;color:#271b10;font-weight:750;padding:13px 20px;text-decoration:none;cursor:pointer}small{color:#76695b}.error{color:#e9a8a8}</style><main><a href="/">← Torna alla Home</a><h1>Il mio progetto</h1><article id="content">Caricamento…</article></main><script>const content=document.getElementById('content');const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){content.textContent='Progetto non specificato';return}try{const r=await fetch('/api/projects/'+encodeURIComponent(id));if(!r.ok)throw Error('Progetto non trovato');const p=await r.json();content.replaceChildren();const h=document.createElement('h2');h.textContent=p.name;const desc=document.createElement('p');desc.textContent=p.description||'Nessuna descrizione';const meta=document.createElement('small');meta.textContent='Salvato · revisione '+p.revision;content.append(h,desc,meta);const formats={

if(p.document?.format==='fustellalab-unified'){const route={crea:'crea.html',astucci:'astucci-nuovo.html',scatole:'scatole.html',forme:'forme.html',bauletti:'bauletti.html'}[p.document.type];if(route){formats['fustellalab-unified']=['/'+route+'?id=','Apri nel nuovo editor'];}}
